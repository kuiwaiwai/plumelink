[package]
name = "qfast-transmission"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
description = "Allocation-free causal transmission kernel for bounded additive control intents"
license = "MIT"
repository = "https://github.com/kuiwaiwai/plumelink"
readme = false
keywords = ["transport", "no-std", "realtime", "protocol", "control"]
