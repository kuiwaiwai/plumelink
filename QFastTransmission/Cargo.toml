include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[lib]
path = "src/lib.rs"

[dependencies]

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

