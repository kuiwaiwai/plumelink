[package]
name = "plumelink"
default-run = "PlumeLink"
version = "0.1.1"
description = "羽连 PlumeLink"
authors = ["PlumeLink contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.98"

[[bin]]
name = "PlumeLink"
path = "src/main.rs"

[lib]
name = "plumelink"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
qfast-transmission = { path = "../QFastTransmission", version = "=0.2.0" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_UI_HiDpi", "Win32_UI_Magnification", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Shutdown", "Win32_System_Power", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
tauri-plugin-autostart = "2"
winreg = "0.10.1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
mdns-sd = "0.21"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.28"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "unwind"
